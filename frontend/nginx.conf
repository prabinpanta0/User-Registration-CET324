worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  init_by_lua_block {
    require "lpeg"
  }

  server {
    listen ${{PORT}};
    listen [::]:${{PORT}};  # IPv6 support
    listen 0.0.0.0:${{PORT}};  # Listen on all IPv4 interfaces
    lua_code_cache ${{CODE_CACHE}};

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Assuming HTTPS-only deployment
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy
    # Adjust 'unsafe-inline' and CDN URLs as necessary.
    # If Toastify.js is served locally, remove its CDN from script-src and style-src.
    # Assuming Toastify is from cdn.jsdelivr.net/npm/toastify-js for now.
    # The 'onerror' attribute in login.lp for captcha image is a minor remaining inline JS.
    # Strict CSP would require hashing or nonce for it if not allowed by default.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://js.hcaptcha.com https://*.hcaptcha.com; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.hcaptcha.com; frame-src 'self' https://*.hcaptcha.com; frame-ancestors 'none'; form-action 'self';" always;

    # Serve static files first
    location /static/ {
      alias static/;
    }

    location /favicon.ico {
      alias static/favicon.ico;
    }

    # Proxy captcha and CSRF token (always to backend)
    location ~ ^/(captcha|csrf-token)$ {
      proxy_pass http://127.0.0.1:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    # Proxy dashboard API endpoints to backend  
    location ~ ^/dashboard/(info|sessions) {
      proxy_pass http://127.0.0.1:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    # Proxy session revoke endpoint specifically
    location ~ ^/dashboard/sessions/[0-9]+/revoke$ {
      proxy_pass http://127.0.0.1:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    # MFA routes - handle GET and POST differently
    location = /mfa/setup {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location = /mfa/verify {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    # Login MFA verification route - only POST requests go to backend
    location = /login/mfa {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      return 404;  # GET requests should return 404 as this is POST-only
    }

    # Handle login/register/logout based on method
    location = /login {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location = /register {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location = /logout {
      error_page 418 = @backend;
      if ($request_method = POST) {
        return 418;
      }
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    # Backend proxy for POST requests
    location @backend {
      proxy_pass http://127.0.0.1:5000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    # Default frontend handler for all other routes
    location / {
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }
  }
}
